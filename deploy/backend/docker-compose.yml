# BACKEND server: PostgreSQL + Redis + Delivez API.
#   cd deploy/backend && cp .env.example .env   (fill it in)
#   docker compose up -d --build
# Expose port 4000 through your HTTPS proxy as https://api.<your-domain>.
name: delivez-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivez_core
      POSTGRES_USER: delivez
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivez -d delivez_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Containers talk to each other by name; these override .env.
      DATABASE_URL: postgresql://delivez:${POSTGRES_PASSWORD}@db:5432/delivez_core?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      # Firebase service-account key: deploy/backend/secrets/firebase-service-account.json (not in git).
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:
  uploads:
